apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - config.yaml
  - cluster.yaml
  - ledger.yaml
  - schema-job.yaml
  - frontend.yaml
  - userservice.yaml
  - contacts.yaml
  - balancereader.yaml
  - ledgerwriter.yaml
  - transactionhistory.yaml
  - httproute.yaml
configMapGenerator:
  - name: bank-sql
    options:
      disableNameSuffixHash: true
    files:
      - sql/accounts-schema.sql
      - sql/accounts-seed.sql
      - sql/ledger-schema.sql
      - sql/ledger-seed.sh
      - sql/load.sh
