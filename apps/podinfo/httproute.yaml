apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-redirect
spec:
  parentRefs:
    - name: playground
      sectionName: http
  hostnames:
    - podinfo.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: podinfo.localhost
            port: 8443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
spec:
  parentRefs:
    - name: playground
      sectionName: https
  hostnames:
    - podinfo.localhost
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
