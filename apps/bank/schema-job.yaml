apiVersion: batch/v1
kind: Job
metadata:
  name: bank-schema
  labels:
    app.kubernetes.io/name: bank-schema
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bank-schema
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: ghcr.io/cloudnative-pg/postgresql:16.15-system-trixie@sha256:1546be7d23066aaf9eb75b07df17c843c98483cede7afdbaf01dca785fb3bf60
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /scripts/load.sh
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: bank-rw.bank.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: LOCAL_ROUTING_NUM
              value: "883745000"
            - name: ACCOUNTS_DB
              value: accounts-db
            - name: ACCOUNTS_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-auth
                  key: username
            - name: ACCOUNTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-auth
                  key: password
            - name: LEDGER_DB
              value: postgresdb
            - name: LEDGER_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-auth
                  key: username
            - name: LEDGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-auth
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: bank-sql
        - name: tmp
          emptyDir: {}
