apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-bank
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/app-bank
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  wait: true
