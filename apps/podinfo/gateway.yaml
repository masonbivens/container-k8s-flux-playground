apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: playground
spec:
  gatewayClassName: eg
  infrastructure:
    labels:
      app.kubernetes.io/name: envoy
  listeners:
    - name: http
      hostname: podinfo.localhost
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: bank-http
      hostname: bank.localhost
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: playground
    - name: https
      hostname: podinfo.localhost
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: podinfo-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: bank-https
      hostname: bank.localhost
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: bank-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              app.kubernetes.io/part-of: playground
