apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-bank
resources:
  - serviceaccount.yaml
  - cluster.yaml
  - ledger.yaml
  - schema-job.yaml
configMapGenerator:
  - name: bank-sql
    options:
      disableNameSuffixHash: true
    files:
      - sql/accounts-schema.sql
      - sql/accounts-seed.sql
      - sql/ledger-schema.sql
      - sql/ledger-seed.sh
      - sql/load.sh
