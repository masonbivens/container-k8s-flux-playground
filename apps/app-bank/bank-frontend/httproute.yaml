apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank-redirect
spec:
  parentRefs:
    - name: playground
      namespace: app-sandbox
      sectionName: bank-http
  hostnames:
    - bank.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: bank.localhost
            port: 8443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank
spec:
  parentRefs:
    - name: playground
      namespace: app-sandbox
      sectionName: bank-https
  hostnames:
    - bank.localhost
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Request-Id
                value: "%REQ(X-REQUEST-ID)%"
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # The bank page loads jQuery, Bootstrap, and Google fonts.
              - name: Content-Security-Policy
                value: "default-src 'self'; script-src 'self' https://code.jquery.com https://unpkg.com; style-src 'self' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
      backendRefs:
        - name: frontend
          port: 80
