apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-bank
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 20m
  dependsOn:
    - name: infrastructure
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/bank
  prune: true
  wait: true
