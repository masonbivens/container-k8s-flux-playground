apiVersion: v1
kind: Service
metadata:
  name: contacts
  labels:
    app.kubernetes.io/name: contacts
spec:
  selector:
    app.kubernetes.io/name: contacts
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
  labels:
    app.kubernetes.io/name: contacts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: contacts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contacts
    spec:
      serviceAccountName: bank
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contacts
          image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/contacts:v0.6.11@sha256:67be31ff16e6e8de0ca0f8ee8fa9c23a900d89b2127d9877e69c488384ef8c2a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VERSION
              value: v0.6.11
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: ACCOUNTS_DB_URI
              valueFrom:
                secretKeyRef:
                  name: accounts-app
                  key: uri
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: accounts-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-auth
                  key: password
          envFrom:
            - configMapRef:
                name: environment-config
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: publickey
              mountPath: /tmp/.ssh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: publickey
          secret:
            secretName: jwt-key
            items:
              - key: jwtRS256.key.pub
                path: publickey
