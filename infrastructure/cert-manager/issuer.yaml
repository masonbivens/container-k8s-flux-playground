apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: playground-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: playground-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: playground
  secretName: playground-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: playground-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: playground
spec:
  ca:
    secretName: playground-ca
