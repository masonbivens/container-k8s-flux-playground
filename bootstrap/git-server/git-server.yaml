apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-server
  namespace: git-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:28.3.0-rootless
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /var/lib/gitea/data/gitea.db
            - name: GITEA__server__HTTP_ADDR
              value: 0.0.0.0
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__DOMAIN
              value: git.localhost
            - name: GITEA__server__ROOT_URL
              value: http://git.localhost:18080/
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__server__START_SSH_SERVER
              value: "false"
            - name: GITEA__server__LFS_START_SERVER
              value: "false"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: GITEA__repository__DEFAULT_BRANCH
              value: main
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-config
                  key: secret-key
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-config
                  key: internal-token
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: git-server
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  type: ClusterIP
  clusterIP: 10.96.200.10
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: http
      port: 18080
      targetPort: http
