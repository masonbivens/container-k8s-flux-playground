apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bank-frontend
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  dependsOn:
    - name: app-bank
    - name: bank-postgres
    - name: sandbox-podinfo
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/app-bank/bank-frontend
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  prune: true
  wait: true
