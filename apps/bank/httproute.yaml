apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank-redirect
spec:
  parentRefs:
    - name: playground
      namespace: apps
      sectionName: bank-http
  hostnames:
    - bank.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: bank.localhost
            port: 8443
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank
spec:
  parentRefs:
    - name: playground
      namespace: apps
      sectionName: bank-https
  hostnames:
    - bank.localhost
  rules:
    - backendRefs:
        - name: frontend
          port: 80
