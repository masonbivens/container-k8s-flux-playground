apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: cnpg-system
  releaseName: cloudnative-pg
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 1h
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      tag: "1.30.1"
      pullPolicy: IfNotPresent
    crds:
      create: true
    config:
      clusterWide: true
    monitoring:
      podMonitorEnabled: false
      grafanaDashboard:
        create: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
